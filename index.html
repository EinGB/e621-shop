<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e621.shop</title>
  <meta name="description" content="Personal homepage" />
  <style>
    :root{
      --bg:#191a16;
      --panel:#272820;
      --yellow:#d7d574;
      --red:#d64848;
      --cream:#f3efd9;
      --muted:#bbb8a4;
      --line:rgba(255,255,255,.11);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      color:var(--cream);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      background:var(--bg);
    }
    .topbar{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 max(20px,4vw);
      background:#171814;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .brand{font-weight:800;letter-spacing:.08em}
    .toplinks{display:flex;gap:18px;font-size:13px;color:#c9c6b0}
    .toplinks a{color:inherit;text-decoration:none}

    /* 直接显示图片本身：无模糊、无渐变遮罩、无文字覆盖、无 cover 裁切。 */
    .banner-stage{
      width:100%;
      background:#d7d574;
      display:flex;
      justify-content:center;
      overflow:hidden;
    }
    .banner-stage img{
      display:block;
      width:min(100%,1280px);
      height:auto;
      max-width:1280px;
      object-fit:contain;
      object-position:center;
      filter:none;
      opacity:1;
      transform:none;
    }

    .profile{
      width:min(1080px,92vw);
      margin:34px auto 0;
      padding:0 0 26px;
      border-bottom:1px solid var(--line);
    }
    .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--yellow)}
    h1{margin:8px 0 12px;font-size:clamp(44px,7vw,78px);line-height:.95;letter-spacing:-.055em}
    .profile p{max-width:700px;margin:0;color:var(--muted);line-height:1.75}

    .wrap{width:min(1080px,92vw);margin:0 auto;padding:28px 0 72px}
    .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}
    .card{
      padding:26px;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--panel);
      transition:transform .2s ease,border-color .2s ease;
    }
    .card:hover{transform:translateY(-3px);border-color:rgba(215,213,116,.35)}
    .card h2{margin:0 0 12px;font-size:22px}
    .card p{margin:0;color:var(--muted);line-height:1.75}
    .mini{display:grid;gap:10px;margin-top:14px}
    .mini div{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025)}
    .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .btn{color:var(--cream);text-decoration:none;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 15px;background:rgba(255,255,255,.035);transition:.18s ease}
    .btn:hover{background:rgba(215,213,116,.10);border-color:rgba(215,213,116,.36)}
    .status{display:flex;gap:8px;align-items:center;margin-top:18px;color:#ddd98a;font-size:13px}
    .dot{width:8px;height:8px;border-radius:50%;background:#ddd98a;box-shadow:0 0 12px #ddd98a}
    footer{text-align:center;padding:0 0 34px;color:#747568;font-size:12px}

    .spark{position:fixed;z-index:9999;pointer-events:none;width:8px;height:8px;border-radius:50%;animation:burst .72s ease-out forwards}
    @keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.15);opacity:0}}

    @media(max-width:760px){
      .topbar{height:50px;padding:0 15px}.toplinks{display:none}
      .profile{margin-top:24px}.grid{grid-template-columns:1fr}.card{padding:21px}
      .banner-stage img{width:100%;height:auto;max-width:1280px}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="brand">EINGB</div>
    <div class="toplinks"><a href="#about">ABOUT</a><a href="#now">NOW</a><a href="https://github.com/EinGB" target="_blank" rel="noreferrer">GITHUB ↗</a></div>
  </nav>

  <header class="banner-stage">
    <img src="assets/banner.webp" alt="主页主题原图" />
  </header>

  <section class="profile">
    <div class="eyebrow">personal homepage · e621.shop</div>
    <h1>EinGB</h1>
    <p>主页上方直接展示主题图片本身。图片不再作为模糊背景使用，也没有渐变、滤镜、文字或半透明面板覆盖在图片上。</p>
  </section>

  <main class="wrap">
    <section class="grid">
      <article class="card" id="about">
        <h2>About</h2>
        <p>这里可以逐步放个人介绍、音乐作品、绘画和其他项目。</p>
        <div class="links"><a class="btn" href="https://github.com/EinGB" target="_blank" rel="noreferrer">GitHub ↗</a><a class="btn" href="#now">Now ↓</a></div>
        <div class="status"><span class="dot"></span> online · e621.shop</div>
      </article>
      <aside class="card" id="now">
        <h2>Now</h2>
        <div class="mini"><div>🎵 Music production</div><div>✏️ Drawing practice</div><div>🧪 Web experiments</div></div>
      </aside>
    </section>
  </main>

  <footer>e621.shop · GitHub Pages</footer>

  <script>
    addEventListener('click',e=>{
      const colors=['#d64848','#e75b52','#d7d574','#efe6b5'];
      for(let i=0;i<10;i++){
        const p=document.createElement('i');
        p.className='spark';p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';p.style.background=colors[i%colors.length];
        const a=Math.random()*Math.PI*2,d=26+Math.random()*58;
        p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');
        document.body.appendChild(p);setTimeout(()=>p.remove(),760);
      }
    });
  </script>
</body>
</html>
